        // Delete a channel
        async function deleteChannel(channelId) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const request = store.delete(channelId);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // Find a channel matching pubkeys, unit, keyset_id, and fee
        // Returns the first matching channel_id, or null if none exists
        async function findChannelByParams(alicePubkey, charliePubkey, unit, keysetId, inputFeePpk) {
            const channels = await new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const index = store.index('charlie_pubkey');
                const request = index.getAll(charliePubkey);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });

            // Filter by params (params are nested in sender_json.channel_params.params_json)
            for (const channel of channels) {
                try {
                    const senderData = JSON.parse(channel.sender_json);
                    const params = JSON.parse(senderData.channel_params.params_json);
                    if (params.alice_pubkey === alicePubkey &&
                        params.unit === unit &&
                        params.keyset_id === keysetId &&
                        params.input_fee_ppk === inputFeePpk) {
                        return channel.channel_id;
                    }
                } catch (e) {
                    // Skip channels with invalid sender_json
                }
            }
            return null;
        }

        // ============================================
        // Request Counts Storage
        // ============================================

        // In-memory request count per channel - tracks how much we owe for payment
        const channelRequestCounts = new Map();

        // Load all request counts from IndexedDB into memory
        async function loadRequestCounts() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(REQUEST_COUNTS_STORE, 'readonly');
                const store = tx.objectStore(REQUEST_COUNTS_STORE);
                const request = store.getAll();
                request.onsuccess = () => {
                    for (const record of request.result) {
                        channelRequestCounts.set(record.channel_id, record.count);
                    }
                    resolve();
                };
                request.onerror = () => reject(request.error);
            });
        }

        // Persist request count to IndexedDB (biggest wins)
        function persistRequestCount(channelId, newCount) {
            const tx = db.transaction(REQUEST_COUNTS_STORE, 'readwrite');
            const store = tx.objectStore(REQUEST_COUNTS_STORE);
            const getRequest = store.get(channelId);
            getRequest.onsuccess = () => {
                const existing = getRequest.result;
                if (!existing || newCount > existing.count) {
                    store.put({ channel_id: channelId, count: newCount });
                }
            };
        }

        // url parameter is only used for logging
        function incrementChannelRequestCount(channelId, url) {
            const count = (channelRequestCounts.get(channelId) || 0) + 1;
            channelRequestCounts.set(channelId, count);
            persistRequestCount(channelId, count);
            const path = '/' + url.split('/').pop();
            console.log('channelRequestCount:', count, 'channel_id:', channelId, 'url_path:', path);
            return count;
        }

        // ============================================
        // Video Position Storage
        // ============================================
        const POSITION_SAVE_THRESHOLD = 5; // Only save if > 5 seconds into video
        const POSITION_MAX_AGE_DAYS = 30;  // Cleanup positions older than 30 days

        // Save video position to IndexedDB
        function saveVideoPosition(masterHash, position) {
            if (!masterHash || !db || position < POSITION_SAVE_THRESHOLD) return;
            const tx = db.transaction(VIDEO_POSITIONS_STORE, 'readwrite');
            const store = tx.objectStore(VIDEO_POSITIONS_STORE);
            store.put({ master_hash: masterHash, position, timestamp: Date.now() });
        }

        // Get video position from IndexedDB
        async function getVideoPosition(masterHash) {
            if (!masterHash || !db) return null;
            return new Promise((resolve) => {
                const tx = db.transaction(VIDEO_POSITIONS_STORE, 'readonly');
                const store = tx.objectStore(VIDEO_POSITIONS_STORE);
                const request = store.get(masterHash);
                request.onsuccess = () => resolve(request.result?.position || null);
                request.onerror = () => resolve(null);
            });
        }

        // Clear video position (e.g., when video ends)
        function clearVideoPosition(masterHash) {
            if (!masterHash || !db) return;
            const tx = db.transaction(VIDEO_POSITIONS_STORE, 'readwrite');
            const store = tx.objectStore(VIDEO_POSITIONS_STORE);
            store.delete(masterHash);
        }

        // Cleanup old positions (called on init)
        async function cleanupOldPositions() {
            if (!db) return;
            const maxAge = Date.now() - (POSITION_MAX_AGE_DAYS * 24 * 60 * 60 * 1000);
            const tx = db.transaction(VIDEO_POSITIONS_STORE, 'readwrite');
            const store = tx.objectStore(VIDEO_POSITIONS_STORE);
            const index = store.index('timestamp');
            const range = IDBKeyRange.upperBound(maxAge);
            const request = index.openCursor(range);
            let deleted = 0;
            request.onsuccess = (event) => {
                const cursor = event.target.result;
                if (cursor) {
                    store.delete(cursor.primaryKey);
                    deleted++;
                    cursor.continue();
                } else if (deleted > 0) {
                    console.log(`Cleaned up ${deleted} old video positions`);
                }
            };
        }

        // ============================================
        // FundedChannel - combines SpilmanChannelSender with current balance
        // ============================================

        // Track which channels have sent params to server this session
        const channelsSentParams = new Set();

        class FundedChannel {
            constructor(sender) {
                this.sender = sender;       // SpilmanChannelSender
                this.channelId = sender.getChannelId();  // Cache since it never changes
            }

            // Convenience getters delegated to sender
            get params() { return this.sender.getParams(); }
            get fundingAmount() { return this.sender.getFundingAmount(); }

            // Get current number of requests made with this channel
            get requestCount() {
                return channelRequestCounts.get(this.channelId) || 0;
            }

            // Balance owed is the request count (1 sat per request)
            get balance() {
                return this.requestCount;
            }

            // Create payment header for a segment (sync for HLS.js xhrSetup)
            createPayment() {
                const balance = this.balance;
                const balanceUpdate = this.sender.createSignedBalanceUpdate(balance);
                const payload = {
                    channel_id: balanceUpdate.channel_id,
                    balance: balanceUpdate.amount,
                    signature: balanceUpdate.signature
                };
                // Only include params and funding proofs if not yet successfully sent this session
                if (!channelsSentParams.has(this.channelId)) {
                    payload.params = this.params;
                    payload.funding_proofs = this.sender.fundingProofs;
                }
                return JSON.stringify(payload);
            }

            // Convert to IndexedDB record
            toRecord() {
                const params = this.params;
                return {
                    channel_id: this.channelId,
                    sender_json: JSON.stringify(this.sender.toJSON()),
                    // Indexed fields for queries
                    charlie_pubkey: params.charlie_pubkey,
                    mint: params.mint
                };
            }

            // Save to IndexedDB
            async save() {
                await saveChannel(this.toRecord());
            }

            // Static: Load by ID
            static async load(channelId) {
                const record = await getChannel(channelId);
                if (!record) return null;
                const sender = SpilmanChannelSender.fromJSON(JSON.parse(record.sender_json));
                return new FundedChannel(sender);
            }

            // Static: Find by pubkeys and keyset params
            static async findByParams(alicePubkey, charliePubkey, unit, keysetId, inputFeePpk) {
                const channelId = await findChannelByParams(alicePubkey, charliePubkey, unit, keysetId, inputFeePpk);
                return channelId ? await FundedChannel.load(channelId) : null;
            }

            // Static: Generate random nonce
            static generateNonce() {
                const bytes = new Uint8Array(16);
                crypto.getRandomValues(bytes);
                return bytesToHex(bytes);
            }
        }

        // ============================================
        // Alice's key management
        // ============================================
        const ALICE_KEY_STORAGE = 'cashu_alice_secret';

        function getOrCreateAliceKey() {
            let secretHex = localStorage.getItem(ALICE_KEY_STORAGE);
            let isNew = false;

            if (!secretHex) {
                // Generate new random private key (32 bytes)
                const secretBytes = secp.utils.randomPrivateKey();
                secretHex = bytesToHex(secretBytes);
                localStorage.setItem(ALICE_KEY_STORAGE, secretHex);
                isNew = true;
            }

            // Derive public key
            const secretBytes = hexToBytes(secretHex);
            const pubkeyBytes = secp.getPublicKey(secretBytes, true); // compressed
            const pubkeyHex = bytesToHex(pubkeyBytes);

            return { secretHex, pubkeyHex, isNew };
        }

        // Current FundedChannel instance - null until a funded channel is ready
        let currentChannel = null;

        // Balance at start of current viewing session (for showing spend delta)
        let sessionStartBalance = 0;

        // Alice's identity
        let alice = null;

        // Charlie's (server) identity
        let charlie = null;

        // Update status display
        function updateStatus() {
            document.getElementById('channel-id').textContent = currentChannel ? currentChannel.channelId.substring(0, 16) + '...' : '-';
            document.getElementById('balance').textContent = currentChannel ? currentChannel.balance : 0;
            document.getElementById('segments').textContent = currentChannel ? currentChannel.fundingAmount : 0;
        }

        // Logging
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'entry';
            entry.innerHTML = `<span class="time">${time}</span> <span class="${type}">${escapeHtml(msg)}</span>`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Parse timestamp string to seconds
        // Supports: "90", "1m30s", "1:30", "1m", "30s"
        function parseTimestamp(str) {
            if (!str) return null;

            // Plain number (seconds)
            if (/^\d+$/.test(str)) {
                return parseInt(str, 10);
            }

            // Format: 1m30s, 1m, 30s
            const msMatch = str.match(/^(?:(\d+)m)?(?:(\d+)s)?$/);
            if (msMatch && (msMatch[1] || msMatch[2])) {
                const mins = parseInt(msMatch[1] || 0, 10);
                const secs = parseInt(msMatch[2] || 0, 10);
                return mins * 60 + secs;
            }

            // Format: 1:30
            const colonMatch = str.match(/^(\d+):(\d+)$/);
            if (colonMatch) {
                return parseInt(colonMatch[1], 10) * 60 + parseInt(colonMatch[2], 10);
            }

            return null;
        }

        // Parse URL hash for master_hash and optional timestamp
        // Formats: #hash, #hash&t=90, #hash&t=1m30s
        function parseUrlHash() {
            const hash = window.location.hash.slice(1);
            if (!hash) return { masterHash: null, startTime: null };

            const parts = hash.split('&');
            const masterHash = parts[0];
            let startTime = null;

            for (const part of parts.slice(1)) {
                if (part.startsWith('t=')) {
                    startTime = parseTimestamp(part.slice(2));
                }
            }

            return { masterHash, startTime };
        }

        // Create payment header (sync, persistence happens in background)
        function createPayment() {
            const payment = currentChannel.createPayment();
            updateStatus();
            return payment;
        }

        // Current HLS instance
        let currentHls = null;

        // Current master hash (for sharing)
        let currentMasterHash = null;

        // Current video's sprite metadata (for progress bar preview)
        let currentSpriteMetaHash = null;
        let currentSpriteMeta = null;

        // Update quality selector with current level
        function updateQualityLabel(levelIndex) {
            const select = document.getElementById('quality-select');
            if (select.value === '-1' && currentHls) {
                const level = currentHls.levels[levelIndex];
                if (level) {
                    select.options[0].text = `Auto (${level.height}p)`;
                }
            }
        }

        // Initialize HLS player with payment injection
        function playVideo(manifestUrl, startTime = null, spriteMetaHash = null) {
            const video = document.getElementById('video');
            const qualitySelect = document.getElementById('quality-select');

            // Show video container
            document.getElementById('video-container').classList.add('visible');

            // Extract master hash from URL for sharing
            const hashMatch = manifestUrl.match(/([0-9a-f]{64})/);
            if (hashMatch) {
                currentMasterHash = hashMatch[1];
            }

            // Store sprite meta hash for progress bar preview
            currentSpriteMetaHash = spriteMetaHash;
            currentSpriteMeta = null; // Will be fetched on demand

            // Clean up previous instance
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }

            // Reset quality selector
            qualitySelect.innerHTML = '<option value="-1">Auto</option>';

            if (Hls.isSupported()) {
                const hls = new Hls({
                    // Limit buffer to ~5 seconds to avoid paying for unwatched video
                    maxBufferLength: 5,
                    maxMaxBufferLength: 8,
                    xhrSetup: function(xhr, url) {
                        // Add payment header for hash-based blob requests
                        if (isHashUrl(url)) {
                            // "xhr.open() should be called in xhrSetup if the callback modifies
                            // the XMLHttpRequest instance in ways that require it to be opened first"
                            // https://github.com/video-dev/hls.js/blob/master/docs/API.md#xhrsetup
                            if (xhr.readyState === XMLHttpRequest.UNSENT) {
                                xhr.open('GET', url, true);
                            }

                            // Increment request count - this increases the balance owed,
                            // which will be included in the payment header below
                            const channelId = currentChannel.channelId;
                            incrementChannelRequestCount(channelId, url);

                            const payment = createPayment();
                            xhr.setRequestHeader('X-Cashu-Channel', payment);
                            const hash = url.split('/').pop().substring(0, 8);
                            log(`Payment: balance=${currentChannel.balance} for ${hash}...`, 'payment');

                            // Update payment indicator if visible
                            if (window.updatePaymentIndicator) {
                                window.updatePaymentIndicator();
                            }

                            // Mark params as sent only after successful response
                            xhr.addEventListener('load', function() {
                                if (xhr.status >= 200 && xhr.status < 300) {
                                    channelsSentParams.add(channelId);
                                }
                            });
                        }
                    }
                });

                currentHls = hls;

                hls.on(Hls.Events.MANIFEST_PARSED, async function(event, data) {
                    log(`Manifest loaded, ${data.levels.length} quality levels`);

                    // Populate quality selector
                    data.levels.forEach((level, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.text = `${level.height}p`;
                        qualitySelect.appendChild(option);
                    });

                    // Seek to start time if specified, otherwise check for saved position
                    if (startTime !== null && startTime > 0) {
                        video.currentTime = startTime;
                        log(`Seeking to ${startTime}s (from URL)`);
                    } else {
                        const savedPosition = await getVideoPosition(currentMasterHash);
                        if (savedPosition && savedPosition > 5) {
                            video.currentTime = savedPosition;
                            log(`Resuming from ${Math.floor(savedPosition)}s`);
                        }
                    }

                    video.play();
                });

                hls.on(Hls.Events.LEVEL_SWITCHED, function(event, data) {
                    const level = hls.levels[data.level];
                    log(`Quality: ${level.height}p`);
                    updateQualityLabel(data.level);
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.error('HLS Error:', data);
                    if (data.fatal) {
                        log(`Fatal error: ${data.type} - ${data.details}`, 'error');
                        if (data.response) {
                            log(`Response: ${data.response.code} - ${data.response.text}`, 'error');
                        }
                        if (data.reason) {
                            log(`Reason: ${data.reason}`, 'error');
                        }
                        if (data.url) {
                            log(`URL: ${data.url}`, 'error');
                        }
                    } else {
                        log(`Error: ${data.type} - ${data.details}`, 'error');
                    }
                });

                // Handle quality selection
                qualitySelect.addEventListener('change', function() {
                    const level = parseInt(this.value);
                    if (level === -1) {
                        hls.currentLevel = -1;  // Auto
                        this.options[0].text = 'Auto';
                        log('Quality: Auto');
                    } else {
                        hls.currentLevel = level;
                        log(`Quality: ${hls.levels[level].height}p (manual)`);
                    }
                });

                hls.loadSource(manifestUrl);
                hls.attachMedia(video);

                log(`Loading: ${manifestUrl}`);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari native HLS - won't work with payment headers
                log('Safari detected - payment headers not supported in native HLS', 'error');
            } else {
                log('HLS not supported in this browser', 'error');
            }
        }

        // Fetch Charlie's (server) channel params
        async function fetchChannelParams() {
            try {
                const response = await fetch('/channel/params');
                const data = await response.json();
                charlie = {
                    pubkeyHex: data.receiver_pubkey,
                    mintsUnitsKeysets: data.mints_units_keysets,
                    pricePerSegment: data.price_per_segment
                };
                log(`Charlie accepts: ${JSON.stringify(charlie.mintsUnitsKeysets)}`);
                return charlie;
            } catch (e) {
                log(`Failed to fetch channel params: ${e}`, 'error');
                return null;
            }
        }

        // Get first approved mint, unit, and keyset from Charlie's params
        function getFirstMintUnitKeyset() {
            if (!charlie || !charlie.mintsUnitsKeysets) return null;
            for (const [mint, units] of Object.entries(charlie.mintsUnitsKeysets)) {
                for (const [unit, keysetIds] of Object.entries(units)) {
                    if (keysetIds.length > 0) {
                        return { mint, unit, keysetId: keysetIds[0] };
                    }
                }
            }
            return null;
        }

        // Fetch full keyset info from a mint
        async function fetchKeysetInfo(mintUrl, keysetId) {
            // Fetch keys for specific keyset
            const keysResponse = await fetch(`${mintUrl}/v1/keys/${keysetId}`);
            if (!keysResponse.ok) {
                throw new Error(`Failed to fetch keys: ${keysResponse.status}`);
            }
            const keysData = await keysResponse.json();

            // Find our keyset in the response
            const keyset = keysData.keysets?.find(k => k.id === keysetId);
            if (!keyset) {
                throw new Error(`Keyset ${keysetId} not found in keys response`);
            }

            // Fetch keyset metadata (for input_fee_ppk)
            const keysetsResponse = await fetch(`${mintUrl}/v1/keysets`);
            if (!keysetsResponse.ok) {
                throw new Error(`Failed to fetch keysets: ${keysetsResponse.status}`);
            }
            const keysetsData = await keysetsResponse.json();

            const keysetMeta = keysetsData.keysets?.find(k => k.id === keysetId);
            if (!keysetMeta) {
                throw new Error(`Keyset metadata for ${keysetId} not found`);
            }

            return {
                keysetId: keysetId,
                unit: keyset.unit,
                keys: keyset.keys,
                inputFeePpk: keysetMeta.input_fee_ppk || 0,
                amounts: Object.keys(keyset.keys).map(a => parseInt(a)).sort((a, b) => b - a)
            };
        }

        // Format duration as M:SS or H:MM:SS
        function formatDuration(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // Load video list
        async function loadVideos() {
            try {
                const response = await fetch('/videos');
                const data = await response.json();

                const listDiv = document.getElementById('video-list');
                listDiv.innerHTML = '';

                if (data.videos.length === 0) {
                    listDiv.innerHTML = '<em>No videos available</em>';
                    return;
                }

                for (const video of data.videos) {
                    const card = document.createElement('div');
                    card.className = 'video-card';

                    const thumb = document.createElement('div');
                    thumb.className = 'video-card-thumb';
                    if (video.preview_hash) {
                        thumb.style.backgroundImage = `url(/${video.preview_hash})`;
                    }

                    const title = document.createElement('div');
                    title.className = 'video-card-title';
                    title.textContent = video.title;
                    title.title = video.title; // Tooltip for long titles

                    const duration = document.createElement('div');
                    duration.className = 'video-card-duration';
                    duration.textContent = formatDuration(video.duration);

                    card.appendChild(thumb);
                    card.appendChild(title);
                    card.appendChild(duration);

                    // Sprite animation on hover
                    let spriteInterval = null;
                    let spriteMeta = null;

                    card.onmouseenter = async () => {
                        if (!video.sprite_meta_hash || spriteInterval) return;

                        // Fetch sprite meta if not cached
                        if (!spriteMeta) {
                            try {
                                const res = await fetch('/' + video.sprite_meta_hash);
                                spriteMeta = await res.json();
                            } catch (e) {
                                return;
                            }
                        }

                        // Animate through sprite frames
                        let frame = 0;
                        thumb.style.backgroundImage = `url(/${spriteMeta.sprite_hash})`;
                        thumb.style.backgroundSize = `${spriteMeta.columns * 200}px auto`;
                        thumb.style.backgroundPosition = '0px 0px'; // Start at first frame

                        spriteInterval = setInterval(() => {
                            frame = (frame + 1) % spriteMeta.frames;
                            const col = frame % spriteMeta.columns;
                            const row = Math.floor(frame / spriteMeta.columns);
                            thumb.style.backgroundPosition = `-${col * 200}px -${row * 113}px`;
                        }, 500);
                    };

                    card.onmouseleave = () => {
                        if (spriteInterval) {
                            clearInterval(spriteInterval);
                            spriteInterval = null;
                        }
                        // Restore preview image
                        if (video.preview_hash) {
                            thumb.style.backgroundImage = `url(/${video.preview_hash})`;
                            thumb.style.backgroundSize = 'cover';
                            thumb.style.backgroundPosition = 'center';
                        }
                    };

                    card.onclick = () => {
                        // Stop sprite animation if running
                        if (spriteInterval) {
                            clearInterval(spriteInterval);
                            spriteInterval = null;
                        }
                        log(`Selected: ${video.title}`);
                        // Reset session balance when starting a new video
                        if (currentChannel) {
                            sessionStartBalance = currentChannel.balance;
                            log(`Session start balance: ${sessionStartBalance}`);
                        }
                        // Update URL hash and play video
                        window.location.hash = video.master_hash;
                        playVideo('/' + video.master_hash, null, video.sprite_meta_hash);
                    };

                    listDiv.appendChild(card);
                }

                log(`Found ${data.videos.length} videos`);

                // Auto-play video from URL hash if present
                const { masterHash, startTime } = parseUrlHash();
                if (masterHash) {
                    // Find matching video to get sprite_meta_hash
                    const matchingVideo = data.videos.find(v => v.master_hash === masterHash);
                    const spriteMetaHash = matchingVideo?.sprite_meta_hash || null;
                    log(`Auto-playing from URL: ${masterHash.substring(0, 8)}...` + (startTime ? ` @ ${startTime}s` : ''));
                    playVideo('/' + masterHash, startTime, spriteMetaHash);
                }
            } catch (e) {
                log(`Failed to load videos: ${e}`, 'error');
            }
        }

        // Initialize
        async function init() {
            // Initialize WASM
            await initWasm();
            log(`WASM module loaded`);

            // Initialize IndexedDB
            try {
                await initDB();
                const channels = await getAllChannels();
                await loadRequestCounts();
                cleanupOldPositions(); // Async, no need to await
                log(`IndexedDB initialized (${channels.length} channels, ${channelRequestCounts.size} request counts)`);
            } catch (e) {
                log(`Failed to initialize IndexedDB: ${e}`, 'error');
            }

            // Get Alice's keypair
            alice = getOrCreateAliceKey();
            if (alice.isNew) {
                log(`Generated new Alice keypair`);
            } else {
                log(`Loaded Alice keypair from storage`);
            }

            // Fetch Charlie's params
            await fetchChannelParams();

            // Log both pubkeys
            log(`Alice pubkey:   ${alice.pubkeyHex}`);
            log(`Charlie pubkey: ${charlie ? charlie.pubkeyHex : 'unavailable'}`);

            // Compute shared secret now that we have both pubkeys
            let sharedSecretHex = null;
            if (charlie) {
                sharedSecretHex = compute_shared_secret(alice.secretHex, charlie.pubkeyHex);
                log(`Shared secret:  ${sharedSecretHex.substring(0, 16)}...`);
            }

            // Fetch keyset info from the selected mint
            const mintInfo = getFirstMintUnitKeyset();
            let keysetInfo = null;
            if (mintInfo) {
                try {
                    keysetInfo = await fetchKeysetInfo(mintInfo.mint, mintInfo.keysetId);
                    log(`Keyset ${keysetInfo.keysetId}: ${keysetInfo.amounts.length} denominations, fee=${keysetInfo.inputFeePpk} ppk`);
                    console.log('Full KeysetInfo:', keysetInfo);
                } catch (e) {
                    log(`Failed to fetch keyset info: ${e}`, 'error');
                }
            }

            // Check for existing channel with matching params, create if none exists
            if (charlie && mintInfo && keysetInfo) {
                currentChannel = await FundedChannel.findByParams(
                    alice.pubkeyHex,
                    charlie.pubkeyHex,
                    mintInfo.unit,
                    mintInfo.keysetId,
                    keysetInfo.inputFeePpk
                );
                if (currentChannel) {
                    log(`Existing channel: ${currentChannel.channelId.substring(0, 16)}... (balance: ${currentChannel.balance}, ${currentChannel.sender.fundingProofs.length} proofs)`);
                    console.log('Channel params:', currentChannel.params);
                } else {
                    // Create and fund new channel
                    log(`Creating channel with mint=${mintInfo.mint} unit=${mintInfo.unit} keyset=${mintInfo.keysetId} fee=${keysetInfo.inputFeePpk}ppk`);

                    // Build params JSON
                    const setupTimestamp = Math.floor(Date.now() / 1000);
                    const expiry = setupTimestamp + 7 * 24 * 60 * 60; // 1 week
                    const senderNonce = FundedChannel.generateNonce();
                    const paramsJson = JSON.stringify({
                        mint: mintInfo.mint,
                        unit: mintInfo.unit,
                        capacity: 1000,
                        keyset_id: mintInfo.keysetId,
                        input_fee_ppk: keysetInfo.inputFeePpk,
                        maximum_amount: 64,
                        setup_timestamp: setupTimestamp,
                        alice_pubkey: alice.pubkeyHex,
                        charlie_pubkey: charlie.pubkeyHex,
                        locktime: expiry,
                        sender_nonce: senderNonce
                    });

                    try {
                        // Generate funding outputs using WASM
                        const fundingOutputsJson = create_funding_outputs(
                            paramsJson,
                            alice.secretHex,
                            JSON.stringify(keysetInfo)
                        );
                        const fundingOutputs = JSON.parse(fundingOutputsJson);
                        log(`Funding outputs: nominal=${fundingOutputs.funding_token_nominal}, ${fundingOutputs.blinded_messages.length} blinded messages`);
                        console.log('Funding outputs:', fundingOutputs);

                        // Convert to cashu-ts OutputData and mint
                        const outputData = wasmOutputsToOutputData(fundingOutputs);
                        console.log('OutputData for minting:', outputData);

                        // Mint the funding token
                        const proofs = await mintFundingToken(
                            mintInfo.mint,
                            fundingOutputs.funding_token_nominal,
                            outputData,
                            keysetInfo
                        );
                        console.log('Funding proofs:', proofs);

                        // Create SpilmanChannelSender
                        const sender = SpilmanChannelSender.create(
                            paramsJson,
                            keysetInfo,
                            alice.secretHex,
                            proofs
                        );
                        log(`SpilmanChannelSender created: channel=${sender.getChannelId().substring(0, 16)}... ${sender.getFundingAmount()} sats funded`);

                        // Wrap in FundedChannel and save
                        currentChannel = new FundedChannel(sender);
                        await currentChannel.save();
                        log(`FundedChannel saved to IndexedDB`);
                    } catch (e) {
                        log(`Failed to create/mint funding outputs: ${e}`, 'error');
                        console.error('Funding outputs error:', e);
                    }
                }
            } else if (!mintInfo) {
                log(`No approved mints/keysets available from server`, 'error');
            } else if (!keysetInfo) {
                log(`Failed to fetch keyset info from mint`, 'error');
            }

            // Record starting balance for this session
            if (currentChannel) {
                sessionStartBalance = currentChannel.balance;
                log(`Session start balance: ${sessionStartBalance}`);
            }

            updateStatus();
            loadVideos();
        }

        init();

        // Dev tools
        document.getElementById('reset-alice').onclick = () => {
            localStorage.removeItem(ALICE_KEY_STORAGE);
            log('Alice key deleted. Refresh to generate new keypair.');
        };

        // Share modal
        function updateShareUrl() {
            const video = document.getElementById('video');
            const includeTime = document.getElementById('share-timestamp').checked;
            const baseUrl = window.location.origin + window.location.pathname;

            let url = baseUrl + '#' + currentMasterHash;
            if (includeTime && video.currentTime > 0) {
                url += '&t=' + Math.floor(video.currentTime);
            }
            document.getElementById('share-url').value = url;
        }

        document.getElementById('share-btn').onclick = () => {
            if (!currentMasterHash) {
                log('No video playing', 'error');
                return;
            }
            updateShareUrl();
            document.getElementById('share-modal').classList.add('visible');
        };

        document.getElementById('share-timestamp').onchange = updateShareUrl;

        document.getElementById('share-copy').onclick = () => {
            const urlInput = document.getElementById('share-url');
            urlInput.select();
            // Use clipboard API if available, fall back to execCommand
            if (navigator.clipboard) {
                navigator.clipboard.writeText(urlInput.value);
            } else {
                document.execCommand('copy');
            }
            const copied = document.getElementById('share-copied');
            copied.classList.add('visible');
            setTimeout(() => copied.classList.remove('visible'), 2000);
        };

        document.getElementById('share-close').onclick = () => {
            document.getElementById('share-modal').classList.remove('visible');
        };

        document.getElementById('share-modal').onclick = (e) => {
            if (e.target.id === 'share-modal') {
                document.getElementById('share-modal').classList.remove('visible');
            }
        };

        // ============================================
        // Custom Video Controls
        // ============================================
        (function() {
            const video = document.getElementById('video');
            const controls = document.getElementById('video-controls');
            const playBtn = document.getElementById('play-btn');
            const timeDisplay = document.getElementById('time-display');
            const progressContainer = document.getElementById('progress-container');
            const progressPlayed = document.getElementById('progress-played');
            const progressBuffered = document.getElementById('progress-buffered');
            const progressHandle = document.getElementById('progress-handle');
            const muteBtn = document.getElementById('mute-btn');
            const volumeSlider = document.getElementById('volume-slider');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const container = document.getElementById('video-container');

            // Format time as M:SS or H:MM:SS
            function formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                if (h > 0) {
                    return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            // Update time display and progress bar
            function updateProgress() {
                const current = video.currentTime;
                const duration = video.duration || 0;
                const percent = duration > 0 ? (current / duration) * 100 : 0;

                progressPlayed.style.width = percent + '%';
                progressHandle.style.left = percent + '%';
                timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
            }

            // Update buffered progress
            function updateBuffered() {
                if (video.buffered.length > 0) {
                    const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                    const duration = video.duration || 0;
                    const percent = duration > 0 ? (bufferedEnd / duration) * 100 : 0;
                    progressBuffered.style.width = percent + '%';
                }
            }

            // Play/Pause
            playBtn.onclick = () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            };

            video.addEventListener('play', () => playBtn.classList.add('playing'));
            video.addEventListener('pause', () => playBtn.classList.remove('playing'));
            video.addEventListener('timeupdate', updateProgress);
            video.addEventListener('progress', updateBuffered);
            video.addEventListener('loadedmetadata', updateProgress);

            // Save playback position periodically
            let lastSavedPosition = 0;
            video.addEventListener('timeupdate', () => {
                const now = video.currentTime;
                if (currentMasterHash && Math.abs(now - lastSavedPosition) >= 5) {
                    saveVideoPosition(currentMasterHash, now);
                    lastSavedPosition = now;
                }
            });

            // Clear position when video ends
            video.addEventListener('ended', () => {
                if (currentMasterHash) {
                    clearVideoPosition(currentMasterHash);
                }
            });

            // Seek on progress bar click/drag
            let isSeeking = false;

            function seekTo(e) {
                const rect = progressContainer.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const percent = Math.max(0, Math.min(1, x / rect.width));
                video.currentTime = percent * video.duration;
                updateProgress();
            }

            progressContainer.addEventListener('mousedown', (e) => {
                isSeeking = true;
                seekTo(e);
            });
            progressContainer.addEventListener('touchstart', (e) => {
                isSeeking = true;
                seekTo(e);
            });

            document.addEventListener('mousemove', (e) => {
                if (isSeeking) seekTo(e);
            });
            document.addEventListener('touchmove', (e) => {
                if (isSeeking) seekTo(e);
            });

            document.addEventListener('mouseup', () => isSeeking = false);
            document.addEventListener('touchend', () => isSeeking = false);

            // Progress bar sprite preview
            const progressPreview = document.getElementById('progress-preview');
            const progressPreviewTime = document.getElementById('progress-preview-time');
            let isTouchDevice = false;

            async function showProgressPreview(clientX) {
                // Don't show preview if no sprite meta or no duration
                if (!currentSpriteMetaHash || !video.duration) {
                    progressPreview.classList.remove('visible');
                    return;
                }

                // Fetch sprite meta if needed
                if (!currentSpriteMeta) {
                    try {
                        const res = await fetch('/' + currentSpriteMetaHash);
                        currentSpriteMeta = await res.json();
                    } catch (err) {
                        return;
                    }
                }

                const rect = progressContainer.getBoundingClientRect();
                const x = clientX - rect.left;
                const percent = Math.max(0, Math.min(1, x / rect.width));
                const timestamp = percent * video.duration;

                // Calculate which frame to show
                const frame = Math.min(
                    Math.floor(timestamp / currentSpriteMeta.interval),
                    currentSpriteMeta.frames - 1
                );
                const col = frame % currentSpriteMeta.columns;
                const row = Math.floor(frame / currentSpriteMeta.columns);

                // Update preview image and position
                progressPreview.style.backgroundImage = `url(/${currentSpriteMeta.sprite_hash})`;
                progressPreview.style.backgroundSize = `${currentSpriteMeta.columns * 160}px ${currentSpriteMeta.rows * 90}px`;
                progressPreview.style.backgroundPosition = `-${col * 160}px -${row * 90}px`;

                // Position horizontally (clamped to container edges)
                const previewWidth = 160;
                const minLeft = previewWidth / 2;
                const maxLeft = rect.width - previewWidth / 2;
                const left = Math.max(minLeft, Math.min(maxLeft, x));
                progressPreview.style.left = left + 'px';

                // Update time display
                progressPreviewTime.textContent = formatTime(timestamp);

                progressPreview.classList.add('visible');
            }

            function hideProgressPreview() {
                progressPreview.classList.remove('visible');
            }

            // Desktop: show on hover
            progressContainer.addEventListener('mousemove', (e) => {
                if (!isTouchDevice) {
                    showProgressPreview(e.clientX);
                }
            });
            progressContainer.addEventListener('mouseleave', () => {
                if (!isTouchDevice) {
                    hideProgressPreview();
                }
            });

            // Mobile: show only while dragging
            progressContainer.addEventListener('touchstart', () => {
                isTouchDevice = true;
            });
            document.addEventListener('touchmove', (e) => {
                if (isSeeking && e.touches.length > 0) {
                    showProgressPreview(e.touches[0].clientX);
                }
            });
            document.addEventListener('touchend', () => {
                hideProgressPreview();
            });

            // Volume
            muteBtn.onclick = () => {
                video.muted = !video.muted;
                muteBtn.textContent = video.muted ? '🔇' : '🔊';
            };

            volumeSlider.oninput = () => {
                video.volume = volumeSlider.value;
                video.muted = false;
                muteBtn.textContent = video.volume == 0 ? '🔇' : '🔊';
            };

            video.addEventListener('volumechange', () => {
                volumeSlider.value = video.muted ? 0 : video.volume;
                muteBtn.textContent = (video.muted || video.volume == 0) ? '🔇' : '🔊';
            });

            // Fullscreen
            fullscreenBtn.onclick = () => {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    container.requestFullscreen();
                }
            };

            document.addEventListener('fullscreenchange', () => {
                fullscreenBtn.textContent = document.fullscreenElement ? '⛶' : '⛶';
            });

            // Show overlays (controls + payment indicator) on activity, hide after delay
            const paymentIndicator = document.getElementById('payment-indicator');
            let hideTimeout = null;

            function updatePaymentIndicator() {
                if (typeof currentChannel !== 'undefined' && currentChannel) {
                    const balance = currentChannel.balance;
                    const capacity = currentChannel.params.capacity;
                    const unit = currentChannel.params.unit;
                    paymentIndicator.textContent = `${balance} / ${capacity} ${unit}`;
                }
            }

            function showOverlays() {
                updatePaymentIndicator();
                controls.classList.add('visible');
                paymentIndicator.classList.add('visible');
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    controls.classList.remove('visible');
                    paymentIndicator.classList.remove('visible');
                }, 3000);
            }

            container.addEventListener('mousemove', showOverlays);
            container.addEventListener('touchstart', showOverlays);
            container.addEventListener('click', showOverlays);
            video.addEventListener('pause', showOverlays);
            video.addEventListener('play', showOverlays);

            // Expose for xhrSetup to call when segments load
            window.updatePaymentIndicator = updatePaymentIndicator;

            // Keyboard controls
            document.addEventListener('keydown', (e) => {
                const videoKeys = ['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyM', 'KeyF'];
                if (videoKeys.includes(e.code)) {
                    showOverlays();
                }

                if (e.code === 'Space') {
                    e.preventDefault();
                    if (video.paused) video.play();
                    else video.pause();
                } else if (e.code === 'ArrowLeft') {
                    video.currentTime = Math.max(0, video.currentTime - 10);
                } else if (e.code === 'ArrowRight') {
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);
                } else if (e.code === 'ArrowUp') {
                    video.volume = Math.min(1, video.volume + 0.1);
                } else if (e.code === 'ArrowDown') {
                    video.volume = Math.max(0, video.volume - 0.1);
                } else if (e.code === 'KeyM') {
                    video.muted = !video.muted;
                } else if (e.code === 'KeyF') {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    } else {
                        container.requestFullscreen();
                    }
                }
            });
        })();

        // Action indicator (brief pause/play feedback like YouTube)
        // Also used for skip feedback
        (function() {
            const video = document.getElementById('video');
            const indicator = document.getElementById('action-indicator');

            function showIndicator(type) {
                // Set icon type
                indicator.innerHTML = type === 'pause'
                    ? '<div class="pause-icon"></div>'
                    : '<div class="play-icon"></div>';

                // Trigger animation
                indicator.classList.remove('show');
                void indicator.offsetWidth; // Force reflow
                indicator.classList.add('show');
            }

            video.addEventListener('pause', () => {
                if (video.readyState > 0) showIndicator('pause');
            });
            video.addEventListener('play', () => {
                if (video.readyState > 0) showIndicator('play');
            });

            function showSkipIndicator(side, seconds) {
                indicator.className = 'show ' + side;
                indicator.innerHTML = `<div class="skip-icon">${seconds > 0 ? '+' : ''}${seconds}s</div>`;
            }

            function handleTap(e) {
                // Ignore taps on control elements
                if (e.target.closest('#video-controls')) return;

                const rect = video.getBoundingClientRect();
                const clientX = e.clientX ?? e.changedTouches?.[0]?.clientX;
                if (clientX === undefined) return;
                const x = clientX - rect.left;
                const width = rect.width;

                if (x < width / 3) {
                    // Left third - skip back
                    video.currentTime = Math.max(0, video.currentTime - 10);
                    showSkipIndicator('left', -10);
                } else if (x > width * 2 / 3) {
                    // Right third - skip forward
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);
                    showSkipIndicator('right', 10);
                } else {
                    // Center - toggle play/pause
                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                }
            }

            // Use touchend on touch devices, click on desktop
            // Once a touch is detected, disable click handling permanently
            let useTouchEvents = false;

            // Listen on container only (events bubble up from video)
            const container = document.getElementById('video-container');
            container.addEventListener('click', (e) => {
                if (!useTouchEvents && (e.target === video || e.target === container)) {
                    handleTap(e);
                }
            });
            container.addEventListener('touchend', (e) => {
                useTouchEvents = true;
                if (e.target === video || e.target === container) {
                    handleTap(e);
                }
            });

            // Reset indicator position after animation
            indicator.addEventListener('animationend', () => {
                indicator.className = '';
            });
        })();

    </script>
</body>
</html>
