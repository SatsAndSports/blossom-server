<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashuTube</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        h1 {
            color: #f7931a;
        }
        #video-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            display: block;
        }
        #status {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: monospace;
        }
        #status .label {
            color: #888;
        }
        #status .value {
            color: #f7931a;
        }
        #video-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .video-btn {
            background: #333;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .video-btn:hover {
            background: #444;
            border-color: #f7931a;
        }
        #log {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            height: 200px;
            overflow-y: auto;
        }
        #log .entry {
            margin-bottom: 4px;
        }
        #log .time {
            color: #666;
        }
        #log .info {
            color: #4a9;
        }
        #log .payment {
            color: #f7931a;
        }
        #log .error {
            color: #e55;
        }
        #quality-control {
            padding: 10px;
            background: #222;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #quality-control label {
            color: #888;
        }
        #quality-select {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="dev-tools" style="margin-bottom:10px;">
        <button id="reset-alice" style="background:#533;border:1px solid #744;color:#e0e0e0;padding:8px 16px;border-radius:4px;cursor:pointer;">Reset Alice Key</button>
    </div>

    <h1>CashuTube</h1>

    <h3>Log</h3>
    <div id="log"></div>

    <div id="status">
        <span class="label">Channel:</span> <span class="value" id="channel-id">-</span><br>
        <span class="label">Balance:</span> <span class="value" id="balance">0</span> sats<br>
        <span class="label">Segments:</span> <span class="value" id="segments">0</span>
    </div>

    <div id="video-container">
        <video id="video" controls></video>
        <div id="quality-control">
            <label for="quality-select">Quality:</label>
            <select id="quality-select">
                <option value="-1">Auto</option>
            </select>
        </div>
    </div>

    <div id="video-list">
        <em>Loading videos...</em>
    </div>

    <script type="module">
        import * as secp from 'https://cdn.jsdelivr.net/npm/@noble/secp256k1@2.1.0/+esm';
        import initWasm, { channel_parameters_get_channel_id, compute_shared_secret, create_funding_outputs } from '/wasm/cdk_wasm.js';
        import { Mint, Wallet, OutputData, hasValidDleq } from 'https://esm.sh/@cashu/cashu-ts@3.1.1';

        // Helper: bytes to hex
        function bytesToHex(bytes) {
            return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Helper: hex to bytes
        function hexToBytes(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
            }
            return bytes;
        }

        // ============================================
        // ChannelParameters - JS representation
        // ============================================
        // Mirrors the Rust ChannelParameters struct (without secret key)
        class ChannelParameters {
            constructor(paramsJson, sharedSecretHex, keysetInfo) {
                this.paramsJson = paramsJson;           // JSON string with basic params
                this.sharedSecretHex = sharedSecretHex; // 32-byte shared secret (hex)
                this.keysetInfo = keysetInfo;           // KeysetInfo object {keysetId, keys, inputFeePpk, amounts}
            }

            // Serialize for storage/WASM
            toJSON() {
                return {
                    params_json: this.paramsJson,
                    shared_secret_hex: this.sharedSecretHex,
                    keyset_info: this.keysetInfo
                };
            }

            // Deserialize from storage
            static fromJSON(json) {
                return new ChannelParameters(
                    json.params_json,
                    json.shared_secret_hex,
                    json.keyset_info
                );
            }

            // Create from components (computes shared secret via WASM)
            static create(paramsJson, aliceSecretHex, keysetInfo) {
                const params = JSON.parse(paramsJson);
                const sharedSecretHex = compute_shared_secret(aliceSecretHex, params.charlie_pubkey);
                return new ChannelParameters(paramsJson, sharedSecretHex, keysetInfo);
            }

            // Get channel ID (computed from params + shared secret)
            getChannelId() {
                return channel_parameters_get_channel_id(this.paramsJson, this.sharedSecretHex);
            }

            // Get parsed params
            getParams() {
                return JSON.parse(this.paramsJson);
            }

            // Convenience getters
            get capacity() { return this.getParams().capacity; }
            get mint() { return this.getParams().mint; }
            get unit() { return this.getParams().unit; }
            get locktime() { return this.getParams().locktime; }
            get alicePubkey() { return this.getParams().alice_pubkey; }
            get charliePubkey() { return this.getParams().charlie_pubkey; }
        }

        // ============================================
        // SpilmanChannelSender - JS representation
        // ============================================
        // Holds the data needed to reconstruct the Rust SpilmanChannelSender
        class SpilmanChannelSender {
            constructor(channelParams, aliceSecretHex, fundingProofs) {
                this.channelParams = channelParams;     // ChannelParameters object
                this.aliceSecretHex = aliceSecretHex;   // Alice's secret key for signing
                this.fundingProofs = fundingProofs;     // Array of funding proofs from mint
            }

            // Serialize for storage
            toJSON() {
                return {
                    channel_params: this.channelParams.toJSON(),
                    alice_secret_hex: this.aliceSecretHex,
                    funding_proofs: this.fundingProofs
                };
            }

            // Deserialize from storage
            static fromJSON(json) {
                return new SpilmanChannelSender(
                    ChannelParameters.fromJSON(json.channel_params),
                    json.alice_secret_hex,
                    json.funding_proofs
                );
            }

            // Create from components
            static create(paramsJson, keysetInfo, aliceSecretHex, fundingProofs) {
                const sharedSecretHex = compute_shared_secret(aliceSecretHex, JSON.parse(paramsJson).charlie_pubkey);
                const channelParams = new ChannelParameters(paramsJson, sharedSecretHex, keysetInfo);
                const channelId = channelParams.getChannelId();
                log(`ChannelParameters created - Channel ID: ${channelId}`);
                return new SpilmanChannelSender(channelParams, aliceSecretHex, fundingProofs);
            }

            // Get channel ID (delegated to channelParams)
            getChannelId() {
                return this.channelParams.getChannelId();
            }

            // Get channel params (parsed)
            getParams() {
                return this.channelParams.getParams();
            }

            // Total funding amount
            getFundingAmount() {
                return this.fundingProofs.reduce((sum, p) => sum + p.amount, 0);
            }

            // Create signed balance update (calls WASM)
            // Returns { balance_update, swap_request } or throws
            createSignedBalanceUpdate(charlieBalance) {
                // TODO: Call WASM function that takes this data and returns signed balance update
                throw new Error('Not yet implemented - needs WASM function');
            }
        }

        // Convert WASM funding outputs to cashu-ts OutputData objects
        function wasmOutputsToOutputData(fundingOutputs) {
            return fundingOutputs.blinded_messages.map((bm, i) => {
                const swb = fundingOutputs.secrets_with_blinding[i];
                // OutputData constructor: (blindedMessage, blindingFactor, secret)
                return new OutputData(
                    { amount: bm.amount, B_: bm.B_, id: bm.id },
                    BigInt('0x' + swb.blinding_factor),
                    new TextEncoder().encode(swb.secret)
                );
            });
        }

        // Mint funding token with custom outputs
        async function mintFundingToken(mintUrl, amount, outputData, keysetInfo) {
            const mint = new Mint(mintUrl);
            const wallet = new Wallet(mint);
            await wallet.loadMint();

            // Get mint quote
            log(`Requesting mint quote for ${amount} sats...`);
            const quote = await wallet.createMintQuote(amount);
            log(`Quote: ${quote.quote.substring(0, 16)}...`);
            console.log('Mint quote:', quote);

            // Poll for payment (testnut should auto-pay)
            log(`Waiting for payment...`);
            let paid = false;
            for (let i = 0; i < 30; i++) {
                const status = await wallet.checkMintQuote(quote.quote);
                if (status.state === 'PAID') {
                    paid = true;
                    log(`Payment confirmed!`);
                    break;
                }
                await new Promise(r => setTimeout(r, 1000));
            }

            if (!paid) {
                throw new Error('Payment not received within timeout');
            }

            // Mint with custom outputs using builder pattern
            log(`Minting ${outputData.length} outputs...`);
            const proofs = await wallet.ops
                .mintBolt11(amount, quote)
                .asCustom(outputData)
                .run();

            log(`Minted ${proofs.length} proofs!`, 'payment');
            console.log('Minted proofs:', proofs);

            // Verify DLEQ proofs using our keysetInfo
            const keyset = { keys: keysetInfo.keys, id: keysetInfo.keysetId };
            let validCount = 0;
            for (const proof of proofs) {
                if (proof.dleq && hasValidDleq(proof, keyset)) {
                    validCount++;
                }
            }
            log(`DLEQ verified: ${validCount}/${proofs.length}`, validCount === proofs.length ? 'payment' : 'error');

            return proofs;
        }

        // Check if URL is a hash-based blob request (64 hex chars)
        function isHashUrl(url) {
            // Handle both relative and absolute URLs
            const path = url.startsWith('/') ? url : new URL(url).pathname;
            // Match /<64-hex-chars> at the end
            return /\/[0-9a-f]{64}$/.test(path);
        }

        // ============================================
        // IndexedDB Channel Storage
        // ============================================
        const DB_NAME = 'cashu_channels';
        const DB_VERSION = 2;  // Bumped for ActiveChannel schema change
        const STORE_NAME = 'channels';

        let db = null;

        // Initialize IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    // Check if object store exists, if not, delete and recreate DB
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.close();
                        const deleteRequest = indexedDB.deleteDatabase(DB_NAME);
                        deleteRequest.onsuccess = () => {
                            // Retry initialization
                            initDB().then(resolve).catch(reject);
                        };
                        deleteRequest.onerror = () => reject(deleteRequest.error);
                        return;
                    }
                    resolve(db);
                };

                request.onupgradeneeded = (event) => {
                    const database = event.target.result;

                    // Delete old store if upgrading (schema changed)
                    if (database.objectStoreNames.contains(STORE_NAME)) {
                        database.deleteObjectStore(STORE_NAME);
                    }

                    // Create channels object store
                    const store = database.createObjectStore(STORE_NAME, { keyPath: 'channel_id' });

                    // Create indexes for querying
                    store.createIndex('charlie_pubkey', 'charlie_pubkey', { unique: false });
                    store.createIndex('mint', 'mint', { unique: false });
                };
            });
        }

        // Save a channel to IndexedDB
        async function saveChannel(channelData) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const request = store.put(channelData);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // Get a channel by ID
        async function getChannel(channelId) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const request = store.get(channelId);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // Get all channels
        async function getAllChannels() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // Get channels by status
        async function getChannelsByStatus(status) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const index = store.index('status');
                const request = index.getAll(status);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // Get channels expiring before a timestamp
        async function getChannelsExpiringBefore(timestamp) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const index = store.index('expiry');
                const range = IDBKeyRange.upperBound(timestamp);
                const request = index.getAll(range);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // Delete a channel
        async function deleteChannel(channelId) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const request = store.delete(channelId);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // Update balance for a channel.
        // The JS client may fire many balance updates in parallel (e.g., during rapid
        // segment requests) and IndexedDB transactions can complete out of order.
        // We only write if newBalance > current, ensuring the highest balance wins.
        async function updateChannelBalance(channelId, newBalance) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const getRequest = store.get(channelId);
                getRequest.onsuccess = () => {
                    const record = getRequest.result;
                    if (record) {
                        if (newBalance > record.current_balance) {
                            record.current_balance = newBalance;
                            const putRequest = store.put(record);
                            putRequest.onsuccess = () => resolve();
                            putRequest.onerror = () => reject(putRequest.error);
                        } else {
                            resolve();
                        }
                    } else {
                        reject(new Error('Channel not found'));
                    }
                };
                getRequest.onerror = () => reject(getRequest.error);
            });
        }

        // Find a channel matching pubkeys, unit, keyset_id, and fee
        // Returns the first matching channel_id, or null if none exists
        async function findChannelByParams(alicePubkey, charliePubkey, unit, keysetId, inputFeePpk) {
            const channels = await new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const index = store.index('charlie_pubkey');
                const request = index.getAll(charliePubkey);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });

            // Filter by params (params are nested in sender_json.channel_params.params_json)
            for (const channel of channels) {
                try {
                    const senderData = JSON.parse(channel.sender_json);
                    const params = JSON.parse(senderData.channel_params.params_json);
                    if (params.alice_pubkey === alicePubkey &&
                        params.unit === unit &&
                        params.keyset_id === keysetId &&
                        params.input_fee_ppk === inputFeePpk) {
                        return channel.channel_id;
                    }
                } catch (e) {
                    // Skip channels with invalid sender_json
                }
            }
            return null;
        }

        // ============================================
        // ActiveChannel - combines SpilmanChannelSender with current balance
        // ============================================
        class ActiveChannel {
            constructor(sender, balance = 0) {
                this.sender = sender;       // SpilmanChannelSender
                this.balance = balance;     // Current balance (sats sent to Charlie)
            }

            // Convenience getters delegated to sender
            get channelId() { return this.sender.getChannelId(); }
            get params() { return this.sender.getParams(); }
            get fundingAmount() { return this.sender.getFundingAmount(); }

            // Increment balance (sync) and persist in background
            incrementBalance() {
                this.balance += 1;
                updateChannelBalance(this.channelId, this.balance);
            }

            // Create payment header for a segment (sync for HLS.js xhrSetup)
            createPayment() {
                this.incrementBalance();
                // TODO: Generate real Schnorr signature via WASM
                const fakeSignature = '0'.repeat(128);  // 64 bytes = 128 hex chars
                return JSON.stringify({
                    channel_id: this.channelId,
                    balance: this.balance,
                    signature: fakeSignature,
                    params: this.params
                });
            }

            // Convert to IndexedDB record
            toRecord() {
                const params = this.params;
                return {
                    channel_id: this.channelId,
                    sender_json: JSON.stringify(this.sender.toJSON()),
                    current_balance: this.balance,
                    // Indexed fields for queries
                    charlie_pubkey: params.charlie_pubkey,
                    mint: params.mint
                };
            }

            // Save to IndexedDB
            async save() {
                await saveChannel(this.toRecord());
            }

            // Static: Load by ID
            static async load(channelId) {
                const record = await getChannel(channelId);
                if (!record) return null;
                const sender = SpilmanChannelSender.fromJSON(JSON.parse(record.sender_json));
                return new ActiveChannel(sender, record.current_balance);
            }

            // Static: Find by pubkeys and keyset params
            static async findByParams(alicePubkey, charliePubkey, unit, keysetId, inputFeePpk) {
                const channelId = await findChannelByParams(alicePubkey, charliePubkey, unit, keysetId, inputFeePpk);
                return channelId ? await ActiveChannel.load(channelId) : null;
            }

            // Static: Generate random nonce
            static generateNonce() {
                const bytes = new Uint8Array(16);
                crypto.getRandomValues(bytes);
                return bytesToHex(bytes);
            }
        }

        // ============================================
        // Alice's key management
        // ============================================
        const ALICE_KEY_STORAGE = 'cashu_alice_secret';

        function getOrCreateAliceKey() {
            let secretHex = localStorage.getItem(ALICE_KEY_STORAGE);
            let isNew = false;

            if (!secretHex) {
                // Generate new random private key (32 bytes)
                const secretBytes = secp.utils.randomPrivateKey();
                secretHex = bytesToHex(secretBytes);
                localStorage.setItem(ALICE_KEY_STORAGE, secretHex);
                isNew = true;
            }

            // Derive public key
            const secretBytes = hexToBytes(secretHex);
            const pubkeyBytes = secp.getPublicKey(secretBytes, true); // compressed
            const pubkeyHex = bytesToHex(pubkeyBytes);

            return { secretHex, pubkeyHex, isNew };
        }

        // Current channel instance
        let currentChannel = null;

        // Alice's identity
        let alice = null;

        // Charlie's (server) identity
        let charlie = null;

        // Update status display
        function updateStatus() {
            document.getElementById('channel-id').textContent = currentChannel ? currentChannel.channelId.substring(0, 16) + '...' : '-';
            document.getElementById('balance').textContent = currentChannel ? currentChannel.balance : 0;
            document.getElementById('segments').textContent = currentChannel ? currentChannel.fundingAmount : 0;
        }

        // Logging
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'entry';
            entry.innerHTML = `<span class="time">${time}</span> <span class="${type}">${escapeHtml(msg)}</span>`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Create payment header (sync, persistence happens in background)
        function createPayment() {
            const payment = currentChannel.createPayment();
            updateStatus();
            return payment;
        }

        // Current HLS instance
        let currentHls = null;

        // Update quality selector with current level
        function updateQualityLabel(levelIndex) {
            const select = document.getElementById('quality-select');
            if (select.value === '-1' && currentHls) {
                const level = currentHls.levels[levelIndex];
                if (level) {
                    select.options[0].text = `Auto (${level.height}p)`;
                }
            }
        }

        // Initialize HLS player with payment injection
        function playVideo(manifestUrl) {
            const video = document.getElementById('video');
            const qualitySelect = document.getElementById('quality-select');

            // Clean up previous instance
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }

            // Reset quality selector
            qualitySelect.innerHTML = '<option value="-1">Auto</option>';

            if (Hls.isSupported()) {
                const hls = new Hls({
                    // Limit buffer to ~5 seconds to avoid paying for unwatched video
                    maxBufferLength: 5,
                    maxMaxBufferLength: 8,
                    xhrSetup: function(xhr, url) {
                        // Add payment header for hash-based blob requests
                        if (isHashUrl(url)) {
                            const payment = createPayment();
                            xhr.setRequestHeader('X-Cashu-Channel', payment);
                            const hash = url.split('/').pop().substring(0, 8);
                            log(`Payment: balance=${currentChannel.balance} for ${hash}...`, 'payment');
                        }
                    }
                });

                currentHls = hls;

                hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                    log(`Manifest loaded, ${data.levels.length} quality levels`);

                    // Populate quality selector
                    data.levels.forEach((level, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.text = `${level.height}p`;
                        qualitySelect.appendChild(option);
                    });

                    video.play();
                });

                hls.on(Hls.Events.LEVEL_SWITCHED, function(event, data) {
                    const level = hls.levels[data.level];
                    log(`Quality: ${level.height}p`);
                    updateQualityLabel(data.level);
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.error('HLS Error:', data);
                    if (data.fatal) {
                        log(`Fatal error: ${data.type} - ${data.details}`, 'error');
                        if (data.response) {
                            log(`Response: ${data.response.code} - ${data.response.text}`, 'error');
                        }
                        if (data.reason) {
                            log(`Reason: ${data.reason}`, 'error');
                        }
                        if (data.url) {
                            log(`URL: ${data.url}`, 'error');
                        }
                    } else {
                        log(`Error: ${data.type} - ${data.details}`, 'error');
                    }
                });

                // Handle quality selection
                qualitySelect.addEventListener('change', function() {
                    const level = parseInt(this.value);
                    if (level === -1) {
                        hls.currentLevel = -1;  // Auto
                        this.options[0].text = 'Auto';
                        log('Quality: Auto');
                    } else {
                        hls.currentLevel = level;
                        log(`Quality: ${hls.levels[level].height}p (manual)`);
                    }
                });

                hls.loadSource(manifestUrl);
                hls.attachMedia(video);

                log(`Loading: ${manifestUrl}`);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari native HLS - won't work with payment headers
                log('Safari detected - payment headers not supported in native HLS', 'error');
            } else {
                log('HLS not supported in this browser', 'error');
            }
        }

        // Fetch Charlie's (server) channel params
        async function fetchChannelParams() {
            try {
                const response = await fetch('/channel/params');
                const data = await response.json();
                charlie = {
                    pubkeyHex: data.receiver_pubkey,
                    mintsUnitsKeysets: data.mints_units_keysets,
                    pricePerSegment: data.price_per_segment
                };
                log(`Charlie accepts: ${JSON.stringify(charlie.mintsUnitsKeysets)}`);
                return charlie;
            } catch (e) {
                log(`Failed to fetch channel params: ${e}`, 'error');
                return null;
            }
        }

        // Get first approved mint, unit, and keyset from Charlie's params
        function getFirstMintUnitKeyset() {
            if (!charlie || !charlie.mintsUnitsKeysets) return null;
            for (const [mint, units] of Object.entries(charlie.mintsUnitsKeysets)) {
                for (const [unit, keysetIds] of Object.entries(units)) {
                    if (keysetIds.length > 0) {
                        return { mint, unit, keysetId: keysetIds[0] };
                    }
                }
            }
            return null;
        }

        // Fetch full keyset info from a mint
        async function fetchKeysetInfo(mintUrl, keysetId) {
            // Fetch keys for specific keyset
            const keysResponse = await fetch(`${mintUrl}/v1/keys/${keysetId}`);
            if (!keysResponse.ok) {
                throw new Error(`Failed to fetch keys: ${keysResponse.status}`);
            }
            const keysData = await keysResponse.json();

            // Find our keyset in the response
            const keyset = keysData.keysets?.find(k => k.id === keysetId);
            if (!keyset) {
                throw new Error(`Keyset ${keysetId} not found in keys response`);
            }

            // Fetch keyset metadata (for input_fee_ppk)
            const keysetsResponse = await fetch(`${mintUrl}/v1/keysets`);
            if (!keysetsResponse.ok) {
                throw new Error(`Failed to fetch keysets: ${keysetsResponse.status}`);
            }
            const keysetsData = await keysetsResponse.json();

            const keysetMeta = keysetsData.keysets?.find(k => k.id === keysetId);
            if (!keysetMeta) {
                throw new Error(`Keyset metadata for ${keysetId} not found`);
            }

            return {
                keysetId: keysetId,
                unit: keyset.unit,
                keys: keyset.keys,
                inputFeePpk: keysetMeta.input_fee_ppk || 0,
                amounts: Object.keys(keyset.keys).map(a => parseInt(a)).sort((a, b) => b - a)
            };
        }

        // Load video list
        async function loadVideos() {
            try {
                const response = await fetch('/videos');
                const data = await response.json();

                const listDiv = document.getElementById('video-list');
                listDiv.innerHTML = '';

                if (data.videos.length === 0) {
                    listDiv.innerHTML = '<em>No videos available</em>';
                    return;
                }

                data.videos.forEach(video => {
                    const btn = document.createElement('button');
                    btn.className = 'video-btn';
                    btn.textContent = video.title;
                    btn.onclick = () => {
                        log(`Selected: ${video.title}`);
                        // Use hash-based URL for Blossom
                        playVideo('/' + video.master_hash);
                    };
                    listDiv.appendChild(btn);
                });

                log(`Found ${data.videos.length} videos`);
            } catch (e) {
                log(`Failed to load videos: ${e}`, 'error');
            }
        }

        // Initialize
        async function init() {
            // Initialize WASM
            await initWasm();
            log(`WASM module loaded`);

            // Initialize IndexedDB
            try {
                await initDB();
                const channels = await getAllChannels();
                log(`IndexedDB initialized (${channels.length} channels stored)`);
            } catch (e) {
                log(`Failed to initialize IndexedDB: ${e}`, 'error');
            }

            // Get Alice's keypair
            alice = getOrCreateAliceKey();
            if (alice.isNew) {
                log(`Generated new Alice keypair`);
            } else {
                log(`Loaded Alice keypair from storage`);
            }

            // Fetch Charlie's params
            await fetchChannelParams();

            // Log both pubkeys
            log(`Alice pubkey:   ${alice.pubkeyHex}`);
            log(`Charlie pubkey: ${charlie ? charlie.pubkeyHex : 'unavailable'}`);

            // Compute shared secret now that we have both pubkeys
            let sharedSecretHex = null;
            if (charlie) {
                sharedSecretHex = compute_shared_secret(alice.secretHex, charlie.pubkeyHex);
                log(`Shared secret:  ${sharedSecretHex.substring(0, 16)}...`);
            }

            // Fetch keyset info from the selected mint
            const mintInfo = getFirstMintUnitKeyset();
            let keysetInfo = null;
            if (mintInfo) {
                try {
                    keysetInfo = await fetchKeysetInfo(mintInfo.mint, mintInfo.keysetId);
                    log(`Keyset ${keysetInfo.keysetId}: ${keysetInfo.amounts.length} denominations, fee=${keysetInfo.inputFeePpk} ppk`);
                    console.log('Full KeysetInfo:', keysetInfo);
                } catch (e) {
                    log(`Failed to fetch keyset info: ${e}`, 'error');
                }
            }

            // Check for existing channel with matching params, create if none exists
            if (charlie && mintInfo && keysetInfo) {
                currentChannel = await ActiveChannel.findByParams(
                    alice.pubkeyHex,
                    charlie.pubkeyHex,
                    mintInfo.unit,
                    mintInfo.keysetId,
                    keysetInfo.inputFeePpk
                );
                if (currentChannel) {
                    log(`Existing channel: ${currentChannel.channelId.substring(0, 16)}... (balance: ${currentChannel.balance}, ${currentChannel.sender.fundingProofs.length} proofs)`);
                    console.log('Channel params:', currentChannel.params);
                } else {
                    // Create and fund new channel
                    log(`Creating channel with mint=${mintInfo.mint} unit=${mintInfo.unit} keyset=${mintInfo.keysetId} fee=${keysetInfo.inputFeePpk}ppk`);

                    // Build params JSON
                    const setupTimestamp = Math.floor(Date.now() / 1000);
                    const expiry = setupTimestamp + 7 * 24 * 60 * 60; // 1 week
                    const senderNonce = ActiveChannel.generateNonce();
                    const paramsJson = JSON.stringify({
                        mint: mintInfo.mint,
                        unit: mintInfo.unit,
                        capacity: 1000,
                        keyset_id: mintInfo.keysetId,
                        input_fee_ppk: keysetInfo.inputFeePpk,
                        maximum_amount: 64,
                        setup_timestamp: setupTimestamp,
                        alice_pubkey: alice.pubkeyHex,
                        charlie_pubkey: charlie.pubkeyHex,
                        locktime: expiry,
                        sender_nonce: senderNonce
                    });

                    try {
                        // Generate funding outputs using WASM
                        const fundingOutputsJson = create_funding_outputs(
                            paramsJson,
                            alice.secretHex,
                            JSON.stringify(keysetInfo)
                        );
                        const fundingOutputs = JSON.parse(fundingOutputsJson);
                        log(`Funding outputs: nominal=${fundingOutputs.funding_token_nominal}, ${fundingOutputs.blinded_messages.length} blinded messages`);
                        console.log('Funding outputs:', fundingOutputs);

                        // Convert to cashu-ts OutputData and mint
                        const outputData = wasmOutputsToOutputData(fundingOutputs);
                        console.log('OutputData for minting:', outputData);

                        // Mint the funding token
                        const proofs = await mintFundingToken(
                            mintInfo.mint,
                            fundingOutputs.funding_token_nominal,
                            outputData,
                            keysetInfo
                        );
                        console.log('Funding proofs:', proofs);

                        // Create SpilmanChannelSender
                        const sender = SpilmanChannelSender.create(
                            paramsJson,
                            keysetInfo,
                            alice.secretHex,
                            proofs
                        );
                        log(`SpilmanChannelSender created: channel=${sender.getChannelId().substring(0, 16)}... ${sender.getFundingAmount()} sats funded`);

                        // Wrap in ActiveChannel and save
                        currentChannel = new ActiveChannel(sender, 0);
                        await currentChannel.save();
                        log(`ActiveChannel saved to IndexedDB`);
                    } catch (e) {
                        log(`Failed to create/mint funding outputs: ${e}`, 'error');
                        console.error('Funding outputs error:', e);
                    }
                }
            } else if (!mintInfo) {
                log(`No approved mints/keysets available from server`, 'error');
            } else if (!keysetInfo) {
                log(`Failed to fetch keyset info from mint`, 'error');
            }

            updateStatus();
            loadVideos();
        }

        init();

        // Dev tools
        document.getElementById('reset-alice').onclick = () => {
            localStorage.removeItem(ALICE_KEY_STORAGE);
            log('Alice key deleted. Refresh to generate new keypair.');
        };
    </script>
</body>
