version: "3.7"

volumes:
  data: {}

services:
  blossom:
    image: cashutube
    build: .
    ports:
      - 3000:3000
    # enable debug logging
    # environment:
    #   Custom config path
    #   BLOSSOM_CONFIG: "data/config.yml"
    #   DEBUG: "*"
    volumes:
      # mount data volume
      - data:/app/data
      # mount config file
      - ./config.yml:/app/config.yml
      # mount custom www dir. On the production server, we do
      # NOT mount this as we use the 'public' folder built into
      # the image instead
      #- ./public:/app/public
